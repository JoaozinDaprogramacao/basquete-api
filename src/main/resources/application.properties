spring.security.oauth2.client.registration.google.scope=profile,email

# ===============================================
# Configuração do Banco de Dados MySQL com JPA
# ===============================================
# URL de conexão com o banco de dados
# O nome do banco 'seu_banco_de_dados' deve existir no seu servidor MySQL.
# useSSL=false e allowPublicKeyRetrieval=true são frequentemente necessários para evitar problemas de conexão.
spring.datasource.url=jdbc:mysql://localhost:3306/basquete?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Usuário e senha do banco de dados
spring.datasource.username=root
spring.datasource.password=Root@1234

# Driver do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================================
# Configuração do Hibernate (JPA)
# ===============================================
# Define o dialeto específico do MySQL para o Hibernate gerar SQL otimizado.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ddl-auto: controla a geração do schema do banco de dados.
#   - 'update': Atualiza o schema se houver mudanças nas entidades (bom para desenvolvimento).
#   - 'validate': Valida se o schema corresponde às entidades.
#   - 'create': Cria o schema a cada inicialização, destruindo dados anteriores.
#   - 'create-drop': Cria o schema na inicialização e o destrói no final.
#   - 'none': Não faz nada (recomendado para produção).
spring.jpa.hibernate.ddl-auto=update

# Opcional: Mostra o SQL gerado pelo Hibernate no console (útil para debug).
spring.jpa.show-sql=true

# Opcional: Formata o SQL mostrado no console para melhor legibilidade.
spring.jpa.properties.hibernate.format_sql=true

# ===============================================
# Configuração do JWT
# ===============================================
app.jwt.secret=${JWT_SECRET:DefaultSecretKeyParaDesenvolvimentoQueNaoDeveSerUsadaEmProducao}
# Tempo de validade do token em milissegundos (ex: 1 hora)
app.jwt.expiration-ms=3600000

app.frontend.url=http://localhost:3000